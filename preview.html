<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>简历展示网页预览</title>
  <style>
    html,body{height:100%;margin:0;background:#050506;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}body{display:grid;place-items:center}main{text-align:center}p{color:#a1a1a6;font-size:14px}a{display:inline-block;margin-top:12px;padding:12px 18px;border:1px solid #45454b;border-radius:999px;color:#f5f5f7;text-decoration:none}a:hover{background:#f5f5f7;color:#050506}
  </style>
</head>
<body>
  <main>
    <p>简历展示网页正在加载</p>
    <a href="http://localhost:3000/">打开网页预览</a>
  </main>
  <script>window.location.replace("http://localhost:3000/");</script>
</body>
</html>
